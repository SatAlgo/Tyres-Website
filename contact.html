<main id="main"><div class="page-hero"><div class="container"><h1>Contact Us</h1><p>Tell us your vehicle and tyre size – we will get back to you.</p></div></div><section class="section"><div class="container split"><div><div class="panel" id="cInfo"></div><div style="margin-top:1.25rem" id="cMap"></div></div><div class="panel"><h2>Send an enquiry</h2><form id="enq" novalidate><div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><div class="form-row"><div><label for="fName">Name *</label><input id="fName" name="name" autocomplete="name" required><div class="err"></div></div><div><label for="fMob">Mobile number *</label><input id="fMob" name="mobile" inputmode="tel" autocomplete="tel" required><div class="err"></div></div></div><div class="form-row"><div><label for="fVeh">Vehicle type *</label><select id="fVeh" name="vehicle"><option value="">Select…</option><option>Car / Hatchback / Sedan</option><option>SUV / MUV</option><option>Two-wheeler</option><option>Commercial / Fleet</option><option>Tractor / Agriculture</option></select><div class="err"></div></div><div><label for="fBrand">Preferred brand</label><select id="fBrand" name="brand"></select></div></div><div class="form-row one"><div><label for="fSize">Tyre size</label><input id="fSize" name="size" placeholder="e.g. 195/65 R15"></div></div><div class="form-row one"><div><label for="fMsg">Message</label><textarea id="fMsg" name="message"></textarea></div></div><div style="margin-bottom:1rem"><label style="display:flex;gap:.6rem;font-weight:400"><input type="checkbox" name="consent" style="width:20px;min-height:20px;margin-top:.2rem"> <span class="small">I agree that my details may be used only to respond to this enquiry. We do not sell or share your information.</span></label><div class="err"></div></div><div style="display:flex;gap:.6rem;flex-wrap:wrap"><button class="btn btn-primary" type="submit">Send Enquiry</button><button class="btn btn-outline" type="button" id="viaMail">Send by Email</button></div><div id="formMsg" role="status" aria-live="polite"></div></form></div></div></section></main>
